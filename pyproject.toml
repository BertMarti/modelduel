[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "modelduel"
dynamic = ["version"]
description = "Dos modelos, una tarea, los mismos tests: compara modelos de IA programando."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alberto Martínez" }]
keywords = ["llm", "benchmark", "evaluation", "cli", "ai", "coding", "pytest"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
# pytest no es una dependencia de ejecución de modelduel, pero hace falta para correr las tareas:
# `pip install "modelduel[pytest]"` lo instala de una vez.
pytest = ["pytest>=8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
modelduel = "modelduel.cli:main"

[project.urls]
Homepage = "https://bertmarti.github.io/modelduel/"
Documentation = "https://github.com/BertMarti/modelduel/blob/main/docs/USO.md"
Source = "https://github.com/BertMarti/modelduel"
Issues = "https://github.com/BertMarti/modelduel/issues"

[tool.hatch.version]
path = "src/modelduel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/modelduel"]

# Las tareas y respuestas grabadas de la demo viajan dentro del paquete (`modelduel demo`).
[tool.hatch.build.targets.wheel.force-include]
"examples" = "modelduel/examples"

# Sin /tests: muchos tests comprueban el repositorio (la web de site/, los results/ de ejemplo y
# los workflows), que no forman parte del paquete; la suite se pasa desde el repo (CI y release.yml).
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/examples",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples/replays", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"examples/tasks/*/test_task.py" = ["I001"]

[tool.mypy]
# Comprobación ligera de tipos del paquete (no de los tests): sin modo estricto, pero en el CI.
python_version = "3.12"
# El código distingue POSIX y Windows con os.name: se comprueba siempre como POSIX para que
# el resultado sea el mismo en los runners de Ubuntu y de Windows.
platform = "linux"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
source = ["modelduel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
