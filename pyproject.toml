[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelduel"
version = "0.1.0"
description = "Dos modelos, una tarea, los mismos tests: compara modelos de IA programando."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Alberto Martínez" }]
keywords = ["llm", "benchmark", "evaluation", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
modelduel = "modelduel.cli:main"

[project.urls]
Homepage = "https://bertmarti.github.io/modelduel/"
Source = "https://github.com/BertMarti/modelduel"

[tool.hatch.build.targets.wheel]
packages = ["src/modelduel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples/replays", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"examples/tasks/*/test_task.py" = ["I001"]

[tool.coverage.run]
source = ["modelduel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
