name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, tests y demo (${{ matrix.os }}, Python ${{ matrix.python }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        # Tareas en JavaScript/TypeScript (experimental): Node 22 ejecuta también las de TS.
        node: ["22"]
        include:
          # El paquete admite >=3.12: también se prueba con la siguiente versión, y con el Node
          # mínimo para JavaScript (20.x: las tareas de TypeScript se saltan con aviso).
          - os: ubuntu-latest
            python: "3.13"
            node: "20"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      - name: Tipos (mypy)
        run: mypy

      - name: Tests
        # En Ubuntu, además, los tests de Docker de verdad (contenedor sin red ni privilegios).
        env:
          MODELDUEL_TEST_DOCKER: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: pytest --cov --cov-report=term -rs

      - name: Demo con respuestas grabadas (liga de tres)
        run: modelduel run examples/tasks --model replay:alfa --model replay:beta --model replay:gamma --out site/demo

      - name: Clasificación pública desde results/
        run: modelduel leaderboard results --out site/leaderboard

      - name: Duelo de dos con --a y --b (compatibilidad con v0.1.0)
        shell: bash
        run: |
          modelduel run examples/tasks --a replay:alfa --b replay:beta --out runs/duelo-dos
          grep -q "Informe de duelo" runs/duelo-dos/index.html

      - name: Informe Markdown (report y run con --format)
        shell: bash
        run: |
          modelduel report site/demo/results.json --format md --out runs/md
          modelduel run examples/tasks --model replay:alfa --model replay:beta --format html,md --out runs/duelo-md
          for f in runs/md/informe.md runs/duelo-md/informe.md; do
            test -s "$f"
            grep -q "^# Informe " "$f"
            grep -q "Una sola ejecución es una señal débil" "$f"
            if grep -q "[^\]<" "$f"; then echo "$f no debe llevar HTML"; exit 1; fi
          done
          test -s runs/duelo-md/index.html
          test ! -e runs/md/index.html

      - name: Solo generar y reproducir (sin APIs)
        shell: bash
        run: |
          modelduel run examples/tasks --model replay:alfa --model replay:beta --solo-generar --out runs/generado
          test -s runs/generado/respuestas.json
          test ! -e runs/generado/results.json
          modelduel run --replay runs/generado --out runs/reproducido
          grep -q "Informe de duelo" runs/reproducido/index.html

      - name: Tareas en JavaScript y TypeScript (experimental, node:test)
        shell: bash
        run: |
          node --version
          if [ "${{ matrix.node }}" = "20" ]; then tareas=examples/tasks-js/format_bytes; else tareas=examples/tasks-js; fi
          modelduel run "$tareas" --model replay:alfa --model replay:beta --model replay:gamma --format html,md --out runs/js | tee runs-js.log
          grep -q "Tareas con Node (experimental)" runs-js.log
          grep -q "JavaScript" runs/js/index.html
          python -c "import json,sys; d=json.load(open('runs/js/results.json')); t={x['id']:x for x in d['tasks']}; f=t['format_bytes']['results']; ok=f['a'][0]['solved'] and not f['b'][0]['solved'] and f['c'][0]['solved']; g=t.get('group_by'); ok=ok and (g is None or (g['results']['a'][0]['solved'] and not g['results']['c'][0]['solved'])); sys.exit(0 if ok else 1)"

      - name: Duelo dentro de Docker (--sandbox docker)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          modelduel run examples/tasks/slugify --a replay:alfa --b replay:beta --sandbox docker --out runs/docker | tee runs/docker.log
          grep -q "Aislamiento: contenedor docker sin red" runs/docker.log
          python -c "import json,sys; d=json.load(open('runs/docker/results.json')); r=d['tasks'][0]['results']; sys.exit(0 if r['a'][0]['solved'] and r['b'][0]['passed']==6 else 1)"
          # JavaScript y TypeScript en la imagen oficial de Node (sin Node del anfitrión).
          modelduel run examples/tasks-js --a replay:alfa --b replay:beta --sandbox docker --out runs/docker-js
          python -c "import json,sys; d=json.load(open('runs/docker-js/results.json')); sys.exit(0 if all(t['results']['a'][0]['solved'] for t in d['tasks']) else 1)"

      - name: Comprobar el informe
        shell: bash
        run: |
          test -s site/demo/index.html
          test -s site/demo/results.json
          grep -q "Una sola ejecución es una señal débil" site/demo/index.html
          grep -q "Informe de liga" site/demo/index.html
          grep -q "Clasificación" site/demo/index.html
          if grep -qi "<script" site/demo/index.html; then echo "El informe no debe tener JavaScript"; exit 1; fi
          test -s site/leaderboard/index.html
          grep -q "Histórico de duelos" site/leaderboard/index.html
          grep -q "Clasificación pública" site/leaderboard/index.html
          test -s "$(ls site/leaderboard/duelos/*/index.html | head -n 1)"
          if grep -rqi "<script" site/leaderboard; then echo "La clasificación y sus informes no deben tener JavaScript"; exit 1; fi

  web:
    name: Portada (duelo en directo, node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Pruebas de la lógica del duelo en directo
        run: node --test "tests/js/*.test.cjs"

      - name: Comprobar el script de la portada
        run: |
          test -s site/demo.js
          test "$(grep -c '<script' site/index.html)" = "1"
          grep -q '<script src="demo.js" defer></script>' site/index.html
          if grep -E 'innerHTML|insertAdjacentHTML|eval\(' site/demo.js; then echo "demo.js no debe escribir HTML"; exit 1; fi

  package:
    name: Paquete (sdist, wheel y metadatos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar las herramientas de empaquetado
        run: python -m pip install --upgrade pip build twine

      - name: Construir sdist y wheel
        run: python -m build

      - name: Comprobar los metadatos
        run: twine check --strict dist/*

      - name: Probar la wheel en un entorno limpio
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install "$(ls dist/*.whl)[pytest]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/modelduel" --version
          "$RUNNER_TEMP/smoke/bin/modelduel" demo --out "$RUNNER_TEMP/smoke-out"
          test -s "$RUNNER_TEMP/smoke-out/index.html"

  security:
    name: Seguridad (gitleaks y pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks revisa todo el historial
          persist-credentials: false

      - name: Secretos en el historial (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependencias vulnerables (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit
          pip-audit --skip-editable
