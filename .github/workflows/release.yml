name: Release

# Publica en PyPI al crear una Release en GitHub, con Trusted Publishing (OIDC):
# no hay tokens ni contraseñas en el repositorio. Los pasos de registro en PyPI están en
# CONTRIBUTING.md y en la descripción del PR que añadió este workflow.
# Solo se dispara al publicar una Release (nunca en push ni en PR) y el job que publica usa el
# environment `pypi`, que solo admite etiquetas `v*`.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Construir y comprobar el paquete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # para comprobar que la etiqueta sale de main
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Instalar las herramientas de empaquetado
        run: python -m pip install --upgrade pip build twine

      - name: Comprobar que la etiqueta sale de main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "El commit de la Release no está en main: no se publica." >&2
            exit 1
          fi

      - name: Comprobar que la etiqueta coincide con la versión
        shell: bash
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/modelduel/__init__.py').read_text()).group(1))")
          echo "Versión del paquete: $version · etiqueta: $GITHUB_REF_NAME"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta ($GITHUB_REF_NAME) debe ser v$version" >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\] - " CHANGELOG.md; then
            echo "CHANGELOG.md no tiene la entrada ## [$version] - AAAA-MM-DD" >&2
            exit 1
          fi

      - name: Pasar la suite de tests
        # Sin MODELDUEL_TEST_DOCKER: los tests de Docker de verdad ya los pasa el CI de la PR.
        run: |
          python -m pip install -e ".[dev]"
          pytest -rs

      - name: Construir sdist y wheel
        run: python -m build

      - name: Comprobar los metadatos
        run: twine check --strict dist/*

      - name: Probar la wheel en un entorno limpio
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install "$(ls dist/*.whl)[pytest]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/modelduel" --version
          "$RUNNER_TEMP/smoke/bin/modelduel" demo --out "$RUNNER_TEMP/smoke-out"
          test -s "$RUNNER_TEMP/smoke-out/index.html"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publicar en PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/modelduel/
    permissions:
      id-token: write # imprescindible para Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Publicar en PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Si falla entre la subida de la wheel y la del sdist, el job se puede reintentar.
          skip-existing: true
