name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos: el build solo lee; el despliegue pide pages e id-token en su job.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generar el informe de demostración
        run: modelduel run examples/tasks --model replay:alfa --model replay:beta --model replay:gamma --out site/demo

      - name: Generar la clasificación pública
        run: modelduel leaderboard results --out site/leaderboard

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
